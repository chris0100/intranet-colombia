<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:fn="http://java.sun.com/jsp/jstl/functions"
      xmlns:jsf="http://xmlns.jcp.org/jsf">
    <ui:composition template="/template/templateAdministrador.xhtml">
        <ui:define name="menu">
            <h:form id="menu-principal">
                <ul class="sidebar-menu">
                    <li class="active" style="margin-top: 20px">
                        <h:commandLink action="#{volantesNominaController.prepareListVolante}">
                            <i class="fa fa-file"></i> 
                            <span>Gestión de comprobantes</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="#{volantesNominaController.prepareListUsuario}">
                            <i class="fa fa-user"></i> 
                            <span>Gestión de usuarios</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="#{volantePeriodoController.prepareListPeriodo}">
                            <i class="fa fa-calendar"></i> 
                            <span>Gestión de períodos</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="#{volantesNominaController.prepareListErrores}">
                            <i class="fa fa-times"></i>
                            <span>Lista de errores</span>
                        </h:commandLink>
                    </li>
                    <p:separator/>
                    <li>
                        <h:commandLink action="/index">
                            <i class="fa fa-dashboard"></i> 
                            <span>Vista de usuario estandar</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="/administrador/modulos">
                            <i class="fa fa-th"></i>
                            <span>Modulos del sistema</span>
                        </h:commandLink>
                    </li>
                </ul>
            </h:form>
        </ui:define>
        <ui:define name="title">Gestión de comprobantes de pago</ui:define>   
        <ui:define name="title2">Formulario de creación de comprobantes</ui:define>   
        <ui:define name="body">
            <p:growl id="growl" showDetail="true" life="2000"/>
            <h:form id="crear-Form">
                <h:panelGroup id="crear-group">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="form-group">
                                <h:outputLabel value="Período:"  />
                                <br></br>
                                <p:selectOneMenu id="periodo" 
                                                 style="width: 100% !important"
                                                 filter="true" filterMatchMode="contains"
                                                 value="#{volantesNominaController.periodoVolante}" 
                                                 requiredMessage="Por favor indique el periodo" 
                                                 required="true" >
                                        <f:selectItem itemLabel="Seleccionar uno.." itemValue="#{null}"/>
                                        <f:selectItems value="#{volantePeriodoController.listaPeriodoVolante}" var="periodo" itemValue="#{periodo}"/>
                                </p:selectOneMenu>
                                <p:message id="periodoMessage" for="periodo" styleClass="error"/>
                                <p:commandButton type="button" value="Agregar nuevo período" icon="fa fa-calendar">
                                    <p:ajax listener="#{volantesNominaController.prepareCreatePeriodo}" update=":formCreatePeriodo" oncomplete="PF('dlgPeriodo').show();" />
                                </p:commandButton>
                            </div>
                            <div class="form-group">
                                <h:outputLabel value="Tipo de nómina:"  />
                                <br></br>
                                <p:selectOneMenu id="tipoNomina" 
                                                 style="width: 100% !important"
                                                 filter="true" filterMatchMode="contains"
                                                 value="#{volantesNominaController.tipoNomina}" 
                                                 requiredMessage="Por favor indique el tipo de nómina" 
                                                 required="true" >
                                        <f:selectItem itemLabel="Seleccionar uno.." itemValue="#{null}"/>
                                        <f:selectItem itemLabel="Administrativa" itemValue="Administrativa"/>
                                        <f:selectItem itemLabel="Producción" itemValue="Producción"/>
                                        <f:selectItem itemLabel="Practicante" itemValue="Practicante"/>
                                        <f:selectItem itemLabel="Ventas" itemValue="Ventas"/>
                                        <f:selectItem itemLabel="Prima administrativa" itemValue="Prima administrativa"/>
                                        <f:selectItem itemLabel="Prima producción" itemValue="Prima producción"/>
                                        <f:selectItem itemLabel="Prima ventas" itemValue="Prima ventas"/>
                                        <f:selectItem itemLabel="Vacaciones" itemValue="Vacaciones"/>
                                        <f:selectItem itemLabel="Cesantías administrativa" itemValue="Cesantias administrativa"/>
                                        <f:selectItem itemLabel="Itereses de cesantías administrativa" itemValue="Itereses de cesantias administrativa"/>
                                        <f:selectItem itemLabel="Cesantías producción" itemValue="Cesantias producción"/>
                                        <f:selectItem itemLabel="Itereses de cesantías producción" itemValue="Itereses de cesantias producción"/>
                                        <f:selectItem itemLabel="Cesantías ventas" itemValue="Cesantias ventas"/>
                                        <f:selectItem itemLabel="Itereses de cesantías ventas" itemValue="Itereses de cesantias ventas"/>
                                        <f:selectItem itemLabel="Innovando - Administrativa" itemValue="Innovando Administrativa"/>
                                        <f:selectItem itemLabel="Innovando - Producción" itemValue="Innovando Producción"/>
                                        <f:selectItem itemLabel="Innovando - Prima administrativa" itemValue="Innovando Prima administrativa"/>
                                        <f:selectItem itemLabel="Innovando - Prima producción" itemValue="Innovando Prima producción"/>
                                        <f:selectItem itemLabel="Innovando - Vacaciones" itemValue="Innovando Vacaciones"/>
                                        <f:selectItem itemLabel="Innovando - Cesantías administrativa" itemValue="Innovando Cesantias administrativa"/>
                                        <f:selectItem itemLabel="Innovando - Itereses de cesantías administrativa" itemValue="Innovando Itereses de cesantias administrativa"/>
                                        <f:selectItem itemLabel="Innovando - Cesantías producción" itemValue="Innovando Cesantias producción"/>
                                        <f:selectItem itemLabel="Innovando - Itereses de cesantías producción" itemValue="Innovando Itereses de cesantias producción"/>
                                </p:selectOneMenu>
                                <p:message id="tipoNominaMessage" for="tipoNomina" styleClass="error"/>
                            </div>
                            <div class="form-group">
                                <h:outputLabel value="Cargar archivo de comprobantes:" />
                                <p:fileUpload cancelLabel="Cancelar"
                                              auto="true"
                                              uploadLabel="Cargar archivo"
                                              allowTypes="/(\.|\/)(P01|P02|P03)$/"
                                              label="Examinar"
                                              mode="advanced" 
                                              update="cadenaCaracter"
                                              required="true"
                                              sizeLimit="2000000"
                                              fileUploadListener="#{volantesNominaController.cargarPlanoVolante}" 
                                              id="archivoDoc"
                                              process="@this"
                                              invalidSizeMessage="El archivo que deseas cargar sobrepasa 1MB"
                                              converterMessage="proceso terminado"
                                              invalidFileMessage="Solo se aceptan archivos tipo .P01 .P02 .P03">
                                 </p:fileUpload>
                                <p:messages id="messageDoc" showDetail="true" closable="false"/>
                            </div> 
                            <div class="form-group">
                                <h:inputTextarea disabled="true" id="cadenaCaracter" style="width: 100%; height: 500px; font-family: monospace !important" value="#{volantesNominaController.cadenaCaracteresText2}"/> 
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-4 form-group">
                            <input jsf:action="#{volantesNominaController.addVolante}"
                                    type="submit" style="font-weight: bold; font-size: 1.2em; width: 100%"
                                    class="submit-form btn btn-facebook"
                                    value="Procesar archivo"
                                    id="myButton1">
                                 <f:setPropertyActionListener value="#{loginController.userLogueado}" target="#{volantesNominaController.usuarioActual}"/>
                            </input>
                        </div>
                        <div class="col-sm-4 form-group">    
                            <h:button class="btn btn-warning btn-block" style="font-weight: bold; font-size: 1.2em; width: 100%" value="Cancelar" outcome="listaVolante"/>
                        </div>
                    </div>
                </h:panelGroup>
            </h:form>
            <p:dialog header="Crear período nuevo" widgetVar="dlgPeriodo" modal="true" height="80%" width="30%">
                <h:form id="formCreatePeriodo">
                   <div class="form-group">
                        <h:outputLabel value="Año:"  />
                        <p:selectOneMenu id="idAnio"
                                         style="width: 100% !important"
                                         filter="true" filterMatchMode="contains"
                                         value="#{volantesNominaController.periodoVolante.anio}" 
                                         requiredMessage="Por favor ingrese el año del periodo" 
                                         required="true">
                            <f:selectItem itemLabel="Seleccionar uno.." itemValue="#{null}"/>
                            <f:selectItem itemLabel="2018" itemValue="2018"/>
                            <f:selectItem itemLabel="2019" itemValue="2019"/>
                            <f:selectItem itemLabel="2020" itemValue="2020"/>
                            <f:selectItem itemLabel="2021" itemValue="2021"/>
                        </p:selectOneMenu>
                        <p:message id="idAnioMessage" for="idAnio" styleClass="error"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel value="Mes:"  />
                        <p:selectOneMenu id="idMes"
                                         style="width: 100% !important"
                                         filter="true" filterMatchMode="contains"
                                         value="#{volantesNominaController.periodoVolante.mes}" 
                                         requiredMessage="Por favor ingrese el mes del periodo" 
                                         required="true">
                            <f:selectItem itemLabel="Seleccionar uno.." itemValue="#{null}"/>
                            <f:selectItem itemLabel="ENERO" itemValue="01"/>
                            <f:selectItem itemLabel="FEBRERO" itemValue="02"/>
                            <f:selectItem itemLabel="MARZO" itemValue="03"/>
                            <f:selectItem itemLabel="ABRIL" itemValue="04"/>
                            <f:selectItem itemLabel="MAYO" itemValue="05"/>
                            <f:selectItem itemLabel="JUNIO" itemValue="06"/>
                            <f:selectItem itemLabel="JULIO" itemValue="07"/>
                            <f:selectItem itemLabel="AGOSTO" itemValue="08"/>
                            <f:selectItem itemLabel="SEPTIEMBRE" itemValue="09"/>
                            <f:selectItem itemLabel="OCTUBRE" itemValue="10"/>
                            <f:selectItem itemLabel="NOVIEMBRE" itemValue="11"/>
                            <f:selectItem itemLabel="DICIEMBRE" itemValue="12"/>
                        </p:selectOneMenu>
                        <p:message id="idMesMessage" for="idMes" styleClass="error"/>
                    </div>
                    <div class="form-group">
                        <h:outputLabel value="Día:"  />
                        <p:selectOneMenu id="idDia" 
                                         style="width: 100% !important"
                                         filter="true" filterMatchMode="contains"
                                         value="#{volantesNominaController.periodoVolante.dia}" 
                                         requiredMessage="Por favor indique el tipo de documento" 
                                         required="true">
                            <f:selectItem itemLabel="Primera quincena del mes" itemValue="15"/>
                            <f:selectItem itemLabel="Segunda quincena del mes" itemValue="30"/>
                        </p:selectOneMenu>
                        <p:message id="idDiaMessage" for="idDia" styleClass="error"/>
                    </div>
                    <div class="row">
                        <div class="col-sm-12 form-group">
                            <p:commandButton styleClass="btn btn-primary btn-block" 
                                             value="Guardar volante" update=":crear-Form:periodo"
                                             action="#{volantesNominaController.addPeriodo}">
                                <f:ajax onevent="dlgPeriodo.hide()" execute="@this"/>
                            </p:commandButton>
                        </div>
                        <div class="col-sm-12 form-group">
                            <p:commandButton class="btn btn-warning btn-block" 
                                             style="background: darkorange"
                                      value="Cancelar" 
                                      oncomplete="PF('dlgPeriodo').hide();"
                                      process="@this"/>
                        </div>
                    </div>
                </h:form>
            </p:dialog>
            <div class="load"></div>
            <script>
                $('#myButton1').click(function(){
                  $('#myButton1').hide();
                  $('.load').addClass('sincronizar');
                    setTimeout(function () { 
                    $('.load').removeClass('sincronizar');
                    $('#myButton1').show();

                  }, 200000000);
                });
            </script>
        </ui:define>
    </ui:composition>
</html>
