<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <ui:composition template="/template/templateUsuario.xhtml">
        <ui:define name="title">Eureka | Intranet</ui:define>        
        <ui:define name="body">
            <p:growl id="growl" showDetail="true" life="2000"/>
            <section class="container container-paginas">
                <h:form>
                    <h:commandLink class="navegacion-paginas" value="Index" action="/index"/> > <h:commandLink style="color: #185291" value="Ver procesos" action="principal"/> > Lista de formatos
                </h:form>
                <header class="header-paginas">
                    <h2> <span class="titulo-paginas">Lista de formatos</span></h2>
                </header>
                <div>
                    <p:outputPanel id="registrosTablePanel">
                        <h:form id="registrosFormList">
                            <p:dataTable value="#{documentoController.listaCompletaUser}" var="registro"
                                         rows="50" paginator="true"  id="documentosTable" class="table-font table table-striped table-bordered dt-responsive nowrap"
                                         paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                         rowsPerPageTemplate="50,100,150" emptyMessage="No se encontraron formatos con el criterio dado">
                                <p:column width="200" filterBy="#{registro.codigo}" filterMatchMode="contains" class="codigo-tabla">
                                    <f:facet name="header"><span class="titulos-tablas"> Código del Formato </span></f:facet>
                                    <h:outputText class="Bold" value="#{registro.codigo.toUpperCase()}"/>
                                </p:column>
                                <p:column filterBy="#{registro.nombre}" width="300" filterMatchMode="contains" class="item-tabla">
                                    <f:facet name="header"><span class="titulos-tablas">Nombre del formato</span></f:facet>
                                    <h:outputText value="#{registro.nombre.toUpperCase()}"/>
                                </p:column>
                                <p:column filterBy="#{registro.version}" width="100" filterMatchMode="contains" class="item-tabla">
                                    <f:facet class="titulos-tablas" name="header"><span class="titulos-tablas">Versión</span></f:facet>
                                    <h:outputText value="#{registro.version}"/>
                                </p:column>
                                <p:column width="150" filterMatchMode="contains" class="item-tabla">
                                    <f:facet name="header"><span class="titulos-tablas">Fecha de actualización</span></f:facet>
                                    <h:outputText value="#{registro.fecha}">
                                        <f:convertDateTime pattern="MMMM dd, YYYY"/>
                                    </h:outputText>
                                </p:column>
                                <p:column filterBy="#{registro.idProceso.toString()}" filterMatchMode="contains" class="item-tabla">
                                     <f:facet class="titulos-tablas" name="header"><span class="titulos-tablas">Proceso</span></f:facet>
                                     <h:outputText value="#{registro.idProceso.toString()}"/>
                                 </p:column>
                                <p:column filterBy="#{registro.procedimiento.toString()}" filterMatchMode="contains" class="item-tabla">
                                     <f:facet class="titulos-tablas" name="header"><span class="titulos-tablas">Procedimiento perteneciente</span></f:facet>
                                     <h:outputText value="#{registro.procedimiento.toString()}"/>
                                 </p:column>
                                <p:column width="55" class="item-tabla">
                                    <h:commandLink id="boton-descargar" class="btn-tabla">
                                        <span class="fa fa-download"></span>
                                        <f:attribute name="registro" value="#{registro}" />
                                        <f:setPropertyActionListener value="#{registro}" target="#{documentoController.documentosActual}"/>
                                        <p:fileDownload value="#{documentoController.descargaDOC}" />
                                    </h:commandLink>
                                    <p:tooltip id="descripcion-descargar" for="boton-descargar" value="Descargar formato" trackMouse="true"/>
                                </p:column>
                            </p:dataTable>
                        </h:form>
                    </p:outputPanel>
                </div>
            </section>
        </ui:define>
    </ui:composition>    
</html>
