<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf">
    <ui:composition template="/template/templateAdministrador.xhtml">
        <ui:define name="body" >
        <p:growl id="growl" sticky="true" showDetail="true" life="3000" />
        <div  class="panel-login" >
                <h:form>
                    <div style="display:block">
                        <figure style="text-align: center">
                            <img jsf:library="images" jsf:name="/logoSoloLoginWeb.png" width="230px"/>
                        </figure>
                    </div>
                    <h:panelGroup id="messagePanel" layout="block">
                         <h:messages class="alert alert-danger"/>
                    </h:panelGroup>
                    <div class="group">
                        <label style="font-weight: bold">Usuario:</label>
                        <h:inputText id="user" 
                                     class="input-login"
                                     value="#{loginController.username}" 
                                     required="true"
                                     requiredMessage="Escribe el correo">
                        </h:inputText>
                        <span class="highlight"></span>
                        <span class="bar"></span>

                    </div>
                    <div class="group">
                         <label style="font-weight: bold">Contraseña:</label>
                        <h:inputSecret id="password" 
                                       class="input-login"
                                       value="#{loginController.password}" 
                                       required="true"
                                       requiredMessage="Escribir la contraseña"/>
                        <span class="highlight"></span>
                        <span class="bar"></span>
                    </div> 
                    <p:commandButton styleClass="btn btn-primary btn-block"
                                     style="font-size: 1.3em !important"
                                     value="Acceder"
                                     update="documentosTablePanel"
                                     ajax="false"
                                     action="#{loginController.login}">
                    </p:commandButton>
                </h:form>
            </div>
        <script type="text/javascript">
                if (#{loginController.authenticated}) {
                    location.reload(true);
                window.location = "#{request.contextPath}/faces/administrador/modGestorCodigoBarraKos/crearCodigoBarra.xhtml";
            }
        </script>
        </ui:define>
    </ui:composition>
</html>
