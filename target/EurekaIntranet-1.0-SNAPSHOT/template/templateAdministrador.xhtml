<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:jsf="http://xmlns.jcp.org/jsf">
    <head jsf:id="head">
        <title>Eureka Intranet | Administrador</title>
        <link rel="icon" type="image/png" href="#{request.contextPath}/resources/images/logoSoloLoginWeb.png"/>
        <meta charset="UTF-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <!-- Bootstrap 3.3.6 -->
        <link href="#{request.contextPath}/resources/css/bootstrap.min.css" rel="stylesheet"/>
        <!-- Font Awesome -->
        <h:outputStylesheet library="css" name="font-awesome.min.css"/>
        <link href="#{request.contextPath}/resources/css/AdminLTE.min.css" rel="stylesheet"/>
        <link href="#{request.contextPath}/resources/css/skin-blue.min.css" rel="stylesheet"/>
        <link href="#{request.contextPath}/resources/css/person.css" rel="stylesheet"/>
        <link href="#{request.contextPath}/resources/css/summernote.css" rel="stylesheet"/>
        <script src="#{request.contextPath}/resources/js/summernote.js"></script>
        <script src="#{request.contextPath}/resources/js/envioForm.js"></script>
        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async="true" src="https://www.googletagmanager.com/gtag/js?id=UA-159716710-1"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());

          gtag('config', 'UA-159716710-1');
        </script>
    </head>
    <body class="hold-transition skin-blue sidebar-mini" jsf:id="body">
        <div class="wrapper">
  <!-- Main Header -->
        <h:form>
            <header class="main-header">
                <!-- Logo -->
                <a ref="#{request.contextPath}/faces/index.xhtml" class="logo" style="background: #ecf0f5">
                    <!-- mini logo for sidebar mini 50x50 pixels -->
                    <span style="color: #003663" class="logo-mini">eka</span>
                    <!-- logo for regular state and mobile devices -->
                    <span class="logo-lg"><img style="width: 70%" src="#{request.contextPath}/resources/images/logoSoloAdminWeb.png"/></span>
                    <!--<span class="logo-lg"><img style="width: 70%" src="#{request.contextPath}/resources/images/logoSoloNavidad.png"/></span> -->
                </a>
                <!-- Header Navbar -->
                <nav class="navbar navbar-static-top" role="navigation">
                  <!-- Sidebar toggle button-->
                  <a href="#" class="sidebar-toggle" data-toggle="offcanvas" role="button">
                    <span class="sr-only">Toggle navigation</span>
                  </a>
                  <!-- Navbar Right Menu -->
                   <h:panelGroup rendered="#{loginController.authenticated}">
                        <div class="navbar-custom-menu">
                            <ul class="nav navbar-nav">
                              <!-- Messages: style can be found in dropdown.less-->
                              
                              <!-- /.messages-menu -->

                              <!-- Notifications Menu -->

                              <!-- Tasks Menu -->

                              <!-- User Account Menu -->
                              <li class="dropdown user user-menu">
                                <!-- Menu Toggle Button -->
                                <a href="mailto:luiscabalweb@gmail.com" class="dropdown-toggle" data-toggle="dropdown">
                                  <!-- The user image in the navbar-->

                                  <!-- hidden-xs hides the username on small devices so only the image appears. -->
                                  <ui:insert name="name">#{loginController.userLogueado.nombre.toUpperCase()}</ui:insert> 

                                </a>
                              </li>
                              <!-- Control Sidebar Toggle Button -->
                                <li>
                                    <h:commandLink action="#{loginController.logoutAdmin}" id="salir">
                                        <i class="fa fa-sign-out"></i>  
                                    </h:commandLink>
                                    <p:tooltip id="descripcion-salir" for="salir" value="Salir del administrador"  trackMouse="true" style="z-index: 2100000 !important"/>
                                </li>
                            </ul>
                            <p:commandButton rendered="#{!loginController.authenticated}" oncomplete="PF('descarga').show()">
                            </p:commandButton>
                        </div>
                    </h:panelGroup>
                </nav>
            </header>
        </h:form>
            <!-- Left side column. contains the logo and sidebar -->
            <aside class="main-sidebar">
              <!-- sidebar: style can be found in sidebar.less -->
                <section class="sidebar">
                  <!-- Sidebar user panel (optional) -->
                   
                  <!-- search form (Optional) -->
                    
                  <!-- /.search form -->

                  <!-- Sidebar Menu -->
                <ui:insert name="menu">
                    
                </ui:insert>
                  <!-- /.sidebar-menu -->
                </section>
              <!-- /.sidebar -->
            </aside>

            <!-- Content Wrapper. Contains page content -->
            <div class="content-wrapper">
              <!-- Content Header (Page header) -->
                <section class="content-header">
                    <h1>
                      <ui:insert name="title"></ui:insert>
                      <small><ui:insert name="title2"></ui:insert></small>
                    </h1>
                </section>

              <!-- Main content -->
                <section class="content">
                    <ui:insert name="body">
                        Default Body
                    </ui:insert> 
                </section>
              <!-- /.content -->
            </div>
            <!-- /.content-wrapper -->

            <!-- Main Footer -->
            <footer class="main-footer">
              <!-- To the right -->
                <div class="pull-right hidden-xs">
                    <strong>Eureka Intranet v. 3.0 |</strong>
                    Desarrollado por el proceso de <span style="color: #367fa9">TIC.</span> 
                </div>
                <!-- Default to the left -->
                <strong>Todos los Derechos Reservados<span style="color: #367fa9"> EKA Corporación S.A </span> © 2018.</strong>
            </footer>

            <!-- Control Sidebar -->
            <!-- /.control-sidebar -->
            <!-- Add the sidebar's background. This div must be placed
                 immediately after the control sidebar -->
            <div class="control-sidebar-bg"></div>
        </div>
        <!-- ./wrapper -->

<!-- REQUIRED JS SCRIPTS -->

<!-- jQuery 2.2.3 -->
        <!-- Bootstrap 3.3.6 -->
        <script src="#{request.contextPath}/resources/js/bootstrap.min.js"></script>
        <!-- AdminLTE App -->
        <script src="#{request.contextPath}/resources/js/app.min.js"></script>
        <script src="#{request.contextPath}/resources/js/envioForm.js"></script>
        <script>
            $('#summernote').summernote({
              placeholder: '',
              tabsize: 2,
              height: 500
            });
        </script>
    </body>
</html>
