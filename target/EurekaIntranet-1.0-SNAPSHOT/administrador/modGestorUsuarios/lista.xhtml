<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:fn="http://java.sun.com/jsp/jstl/functions">
    <ui:composition template="/template/templateAdministrador.xhtml">
        <ui:define name="menu">
            <h:form id="menu-principal">
                <ul class="sidebar-menu">
                    <li class="active" style="margin-top: 20px">
                        <h:commandLink action="#{usuarioController.prepareList}" rendered="#{loginController.admin}">
                          <i class="fa fa-users"></i> 
                          <span>Administrar usuarios</span>
                       </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="/index">
                            <i class="fa fa-dashboard"></i> 
                            <span>Vista de usuario estandar</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="/administrador/modulos">
                            <i class="fa fa-th"></i>
                            <span>Modulos del sistema</span>
                        </h:commandLink>
                    </li>
                </ul>
            </h:form>
        </ui:define>
        <ui:define name="title">Gestión de usuarios</ui:define>   
        <ui:define name="title2">Administración de usuarios</ui:define>   
        <ui:define name="body">
            <p:growl id="growl" showDetail="true" life="2000"/>
            <h:form id="documentosFormList">
                <p:outputPanel id="documentosTablePanel">
                    <p:dataTable value="#{usuarioController.listaUsuarios}" var="item"
                                 rows="50" id="documentosTable" paginator="true"
                                 paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rowsPerPageTemplate="50, 100,150">
                        <f:facet name="header">
                            <div class="container-fluid">
                                <div class="row">
                                    <div class="col-md-4">
                                        <p:button icon="ui-icon-arrowthick-1-w"
                                                value="Volver pagina principal" 
                                                style="font-size: 1.2em !important; padding: 5px; left: 0"
                                                outcome="/administrador/modulos.xhtml"/>
                                    </div>
                                    <div class="col-md-4">
                                        <h4 class="colorLetra" style="font-weight: bold" >
                                            Total de usuarios: #{fn:length(usuarioController.listaUsuarios)}
                                        </h4>
                                    </div>
                                    <div class="col-md-3">
                                        <p:commandButton icon="ui-icon-folder-open"
                                                         ajax="false"
                                                        value="Crear nuevo usuario"
                                                        style="font-size: 1.2em !important;padding: 5px; right: 0"
                                                        action="#{usuarioController.prepareCreate}"/>
                                    </div>
                                    <div class="col-md-1">
                                        <h:commandLink id="exportExcel">
                                            <p:graphicImage library="images" name="/icons/logoExcel.png" width="40"/>
                                            <p:dataExporter type="xls" postProcessor="#{exportarTable.postProcessXLS}"
                                                    target="documentosTable" fileName="tabla" />
                                        </h:commandLink>
                                        <p:tooltip id="descripcion-exportExcel" for="exportExcel" value="Exportar tabla en formato .xls" trackMouse="true"/>
                                    </div>
                                </div>
                            </div>
                        </f:facet>
                        <p:column filterBy="#{item.nombre}" filterMatchMode="contains">
                            <f:facet name="header">Nombre</f:facet>
                            <h:outputText style="font-weight: bold" value="#{item.nombre.toUpperCase()}"/>
                        </p:column>
                        <p:column filterBy="#{item.correo}" filterMatchMode="contains">
                            <f:facet name="header">Correo electronico </f:facet>
                            <h:outputText style="font-weight: bold" value="#{item.correo.toUpperCase()}"/>
                        </p:column>
                        <p:column filterBy="#{item.proceso}" filterMatchMode="contains">
                            <f:facet name="header">Proceso</f:facet>
                            <h:outputText value="#{item.proceso}"/>
                        </p:column>
                        <p:column filterBy="#{item.username}" filterMatchMode="contains">
                            <f:facet name="header">Nombre de usuario</f:facet>
                            <h:outputText value="#{item.username}"/>
                        </p:column>
                        <p:column width="110">
                            <p:commandButton ajax="false" icon="ui-icon-pencil" id="actualizar" action="#{usuarioController.prepareEdit}" >
                                <f:setPropertyActionListener value="#{item}" target="#{usuarioController.usuarioActual}"/>
                            </p:commandButton>
                            <p:tooltip id="descripcion-botonActualizacion" for="actualizar" value="Actualizar usuario" trackMouse="true" />
                        </p:column>
                    </p:dataTable>
                </p:outputPanel>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
