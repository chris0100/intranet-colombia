<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf">
    <ui:composition template="/template/templateAdministrador.xhtml">
        <ui:define name="menu">
            <h:form id="menu-principal">
                <ul class="sidebar-menu">
                    <li class="active" style="margin-top: 20px">
                        <h:commandLink action="#{contenidoController.prepareList}">
                            <i class="fa fa-bullhorn"></i> 
                            <span>Gestión de contenidos</span>
                        </h:commandLink>
                    </li>
                    <p:separator/>
                    <li>
                        <h:commandLink action="/index">
                            <i class="fa fa-dashboard"></i> 
                            <span>Vista de usuario estandar</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="/administrador/modulos">
                            <i class="fa fa-th"></i>
                            <span>Modulos del sistema</span>
                        </h:commandLink>
                    </li>
                </ul>
            </h:form>
        </ui:define>
        <ui:define name="title">Vista previa del contenido</ui:define> 
        <ui:define name="title2">Así luce el contenido que creaste</ui:define> 
        <ui:define name="body">
            <p:growl id="growl" showDetail="true" life="2000"/>
            <div class="container-fluid">
                <div class="col-md-8">
                    <header style="text-align: center; margin-bottom: 2em">
                        <h2> <span style="border-bottom: 5px solid #185291;">#{contenidoController.contenidoActual.titulo}</span></h2>
                    </header>
                   <div style="border: 1px solid lightgray; padding: 2em; padding-bottom: 0;">
                       <p:outputPanel id="divPanel">
                           <figure style="text-align: center">
                               <p:graphicImage  rendered="#{contenidoController.vacioImg1}" id="img1" cache="false" style="width: 100%" value="#{contenidoController.img1}"/>    
                           </figure>
                           <h:outputLabel rendered="#{contenidoController.vacioDes1}" style="width: 100%" value="#{contenidoController.contenidoActual.descripcion}" escape="false" /> 
                       </p:outputPanel>
                   </div>
                   <div class="row" style="margin-bottom: 3em; margin-left: 1em; color: #185291">
                       <div style="display: inline-block; margin-right: 1px">
                           <span class="fa fa-calendar" style="margin-right: 5px; color: black"> </span>
                           <h:outputText value="#{contenidoController.contenidoActual.fecha}">
                               <f:convertDateTime pattern="MMMM dd, YYYY"/>
                           </h:outputText>  
                       </div>
                       <div style="display: inline-block; margin-right: 1px">
                           <span class="fa fa-user" style="color: black"> </span>
                           <h:outputText value=" #{contenidoController.contenidoActual.idUsuario.nombre}"/>
                       </div>
                       <div style="display: inline-block; margin-right: 1px">
                           <span class="fa fa-bullhorn" style="color: black"> </span>
                           <h:outputText value=" #{contenidoController.contenidoActual.tipo.nombre}"/> 
                       </div>
                   </div>
                </div>
                <div class="col-md-4">
                    <p:button icon="ui-icon-arrowthick-1-w"
                    value="Volver" 
                    style="font-size: 1.2em !important; padding: 5px; left: 0; width: 100%; margin-top: 3em"
                    outcome="lista.xhtml"/>
                </div>
            </div>
        </ui:define>
    </ui:composition>
</html>
