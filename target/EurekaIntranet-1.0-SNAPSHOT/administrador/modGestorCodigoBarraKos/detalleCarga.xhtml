<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"

      xmlns:f="http://xmlns.jcp.org/jsf/core"

    <ui:composition template="/template/templateAdministrador.xhtml">
        <ui:define name="menu">

                    <li class="active" style="margin-top: 20px">

                            <i class="fa fa-barcode"></i> 
                            <span>Crear código</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="log">
                            <i class="fa fa-check"></i> 
                            <span>Log cargados</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="#{lecturasController.prepareLogOp}">

                            <span>Log cargados por OP</span>
                        </h:commandLink>
                    </li>
                    <p:separator></p:separator>
                    <li>

                    </li>
                    <li>
                        <h:commandLink action="/administrador/modulos">

                    <div class="panel-heading"><span style="font-weight: bold; font-size: 1.3em">Observaciones</span></div>
                    <div class="panel-body">
                        <h:outputText style="font-weight: bold; font-size: 1.3em" value="#{lecturasController.lecturasActual.f001Observaciones}" escape="false">
                        </h:outputText>
                    </div>
                    <p:commandButton icon="ui-icon-arrowthick-1-w" ajax="false" value="Volver atrás" action="#{lecturasController.prepareCreate}">
                    </p:commandButton>
