<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:fn="http://java.sun.com/jsp/jstl/functions">
    <ui:composition template="/template/templateAdministrador.xhtml">
        <ui:define name="menu">
            <h:form id="menu-principal">
                <ul class="sidebar-menu">
                    <li style="margin-top: 20px">
                        <h:commandLink action="#{configOrdenDespachoController.prepareList}">
                            <i class="fa fa-cog" aria-hidden="true"></i> 
                            <span>Lista configuraciones</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="#{ordenesDespachoController.prepareList}">
                            <i class="fa fa-th" aria-hidden="true"></i> 
                            <span>Reporte ordenes de despacho</span>
                        </h:commandLink>
                    </li>
                    <p:separator/>
                    <li>
                        <h:commandLink action="/index">
                            <i class="fa fa-dashboard"></i> 
                            <span>Vista de usuario estándar</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="/administrador/modulos">
                            <i class="fa fa-th"></i>
                            <span>Modulos del sistema</span>
                        </h:commandLink>
                    </li>
                </ul>
            </h:form>
        </ui:define>
        <ui:define name="title">Lista de configuraciones</ui:define>   
        <ui:define name="title2">Lista de configuraciones</ui:define>   
        <ui:define name="body">
            <p:growl id="growl" showDetail="true" life="2000"/>
            <h:form id="List">
                <p:outputPanel id="TablePanel">
                    <p:dataTable value="#{configOrdenDespachoController.listaConfig}" var="item"
                                 rows="50" id="Table" paginator="true" style="width: 500px"
                                 paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                                 rowsPerPageTemplate="50, 100,150">
                        <f:facet name="header">
                            <div class="container-fluid">
                                <div class="row">
                                    <div class="col-md-6">
                                        <h4 class="colorLetra" style="font-weight: bold" >
                                            Total configuraciones: #{fn:length(configOrdenDespachoController.listaConfig)}
                                        </h4>
                                    </div>
                                    <div class="col-md-6">
                                        <p:commandButton icon="ui-icon-folder-open"
                                                         ajax="false"
                                                        value="Crear nuevo"
                                                        style="font-size: 1.2em !important;padding: 5px; right: 0"
                                                        action="#{configOrdenDespachoController.prepareCreate}">
                                        </p:commandButton>
                                    </div>
                                </div>
                            </div>
                        </f:facet>
                        <p:column filterBy="#{item.tipo}" filterMatchMode="contains" width="110" >
                            <f:facet name="header">Tipo de configuración</f:facet>
                            <h:outputText style="font-weight: bold" value="#{item.tipo}"/>
                        </p:column>
                        <p:column filterBy="#{item.numerico}" filterMatchMode="contains">
                            <f:facet name="header">Valor numerico</f:facet>
                            <h:outputText value="#{item.numerico}"/>
                        </p:column>
                        <p:column filterBy="#{item.valor}" filterMatchMode="contains">
                            <f:facet name="header">Valor</f:facet>
                            <h:outputText value="#{item.valor}"/>
                        </p:column>
                        <p:column width="80">
                            <p:commandButton ajax="false" icon="ui-icon-pencil" id="actualizar" action="#{configOrdenDespachoController.prepareEdit}">
                                <f:setPropertyActionListener value="#{item}" target="#{configOrdenDespachoController.configActual}"/>
                            </p:commandButton>
                            <p:tooltip id="descripcion-botonActualizacion" for="actualizar" value="Actualizar" trackMouse="true" />
                            <p:commandButton ajax="false" icon="ui-icon-trash" id="delete" action="#{configOrdenDespachoController.delete}">
                                <f:setPropertyActionListener value="#{item}" target="#{configOrdenDespachoController.configActual}"/>
                            </p:commandButton>
                            <p:tooltip id="descripcion-botonDelete" for="delete" value="Eliminar" trackMouse="true" />
                        </p:column>
                    </p:dataTable>
                </p:outputPanel>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
