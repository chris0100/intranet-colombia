<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:jsf="http://xmlns.jcp.org/jsf">
    <ui:composition template="/template/templateAdministrador.xhtml">
        <ui:define name="menu">
             <h:form id="menu-principal">
                <ul class="sidebar-menu">
                    <li style="margin-top: 20px">
                        <h:commandLink action="#{volantesNominaController.prepareListVolante}">
                            <i class="fa fa-file"></i> 
                            <span>Gestión de comprobantes</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="#{volantesNominaController.prepareListUsuario}">
                            <i class="fa fa-user"></i> 
                            <span>Gestión de usuarios</span>
                        </h:commandLink>
                    </li>
                    <li class="active">
                        <h:commandLink action="#{volantePeriodoController.prepareListPeriodo}">
                            <i class="fa fa-calendar"></i> 
                            <span>Gestión de períodos</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="#{volantesNominaController.prepareListErrores}">
                            <i class="fa fa-times"></i>
                            <span>Lista de errores</span>
                        </h:commandLink>
                    </li>
                    <p:separator/>
                    <li>
                        <h:commandLink action="/index">
                            <i class="fa fa-dashboard"></i> 
                            <span>Vista de usuario estandar</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="/administrador/modulos">
                            <i class="fa fa-th"></i>
                            <span>Modulos del sistema</span>
                        </h:commandLink>
                    </li>
                </ul>
            </h:form>
        </ui:define>
        <ui:define name="title">Crear nuevo período</ui:define> 
        <ui:define name="title2">Ingresa los datos del período</ui:define>
        <ui:define name="body">
            <p:growl id="growl" showDetail="true" life="2000"/>
            <h:form id="formulario-crearDocu" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <h:outputLabel value="Año:"  />
                            <p:selectOneMenu id="idAnio"
                                             style="width: 100% !important"
                                             filter="true" filterMatchMode="contains"
                                             value="#{volantePeriodoController.periodoVolanteActual.anio}" 
                                             requiredMessage="Por favor ingrese el año del periodo" 
                                             required="true">
                                <f:selectItem itemLabel="Seleccionar uno.." itemValue="#{null}"/>
                                <f:selectItem itemLabel="2018" itemValue="2018"/>
                                <f:selectItem itemLabel="2019" itemValue="2019"/>
                                <f:selectItem itemLabel="2020" itemValue="2020"/>
                                <f:selectItem itemLabel="2021" itemValue="2021"/>
                            </p:selectOneMenu>
                            <p:message id="idAnioMessage" for="idAnio" styleClass="error"/>
                        </div>
                        <div class="form-group">
                            <h:outputLabel value="Mes:"  />
                            <p:selectOneMenu id="idMes"
                                             style="width: 100% !important"
                                             filter="true" filterMatchMode="contains"
                                             value="#{volantePeriodoController.periodoVolanteActual.mes}" 
                                             requiredMessage="Por favor ingrese el mes del periodo" 
                                             required="true">
                                <f:selectItem itemLabel="ENERO" itemValue="01"/>
                                <f:selectItem itemLabel="FEBRERO" itemValue="02"/>
                                <f:selectItem itemLabel="MARZO" itemValue="03"/>
                                <f:selectItem itemLabel="ABRIL" itemValue="04"/>
                                <f:selectItem itemLabel="MAYO" itemValue="05"/>
                                <f:selectItem itemLabel="JUNIO" itemValue="06"/>
                                <f:selectItem itemLabel="JULIO" itemValue="07"/>
                                <f:selectItem itemLabel="AGOSTO" itemValue="08"/>
                                <f:selectItem itemLabel="SEPTIEMBRE" itemValue="09"/>
                                <f:selectItem itemLabel="OCTUBRE" itemValue="10"/>
                                <f:selectItem itemLabel="NOVIEMBRE" itemValue="11"/>
                                <f:selectItem itemLabel="DICIEMBRE" itemValue="12"/>
                            </p:selectOneMenu>
                            <p:message id="idMesMessage" for="idMes" styleClass="error"/>
                        </div>
                        <div class="form-group">
                            <h:outputLabel value="Día:"  />
                            <p:selectOneMenu id="idDia" 
                                             style="width: 100% !important"
                                             filter="true" filterMatchMode="contains"
                                             value="#{volantePeriodoController.periodoVolanteActual.dia}" 
                                             requiredMessage="Por favor indique el tipo de documento" 
                                             required="true">
                                <f:selectItem itemLabel="Primera quincena del mes" itemValue="15"/>
                                <f:selectItem itemLabel="Segunda quincena del mes" itemValue="30"/>
                            </p:selectOneMenu>
                            <p:message id="idDiaMessage" for="idDia" styleClass="error"/>
                        </div>
                        <div class="row">
                            <div class="col-sm-6 form-group">
                                <p:commandButton class="btn btn-primary btn-block"
                                                     ajax="false"
                                                     value="Guardar"
                                                     action="#{volantePeriodoController.add}"
                                                     onclick="onSubmitButton();"/>
                            </div>
                            <div class="col-sm-6 form-group">    
                                <h:button class="btn btn-warning btn-block" value="Cancelar" outcome="listaPeriodo"/>
                            </div>
                        </div>
                    </div>
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
