<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:fn="http://java.sun.com/jsp/jstl/functions"
      xmlns:jsf="http://xmlns.jcp.org/jsf">
    <ui:composition template="/template/templateAdministrador.xhtml">
        <ui:define name="menu">
            <h:form id="menu-principal">
                <ul class="sidebar-menu">
                   <li style="margin-top: 20px">
                        <h:commandLink action="#{capturaParadaGeController.prepareDashboard}">
                            <i class="fa fa-dashboard" aria-hidden="true"></i> 
                            <span>Dashboard</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="#{capturaParadaGeController.prepareList}">
                            <i class="fa fa-rocket"></i> 
                            <span>Capturar información</span>
                        </h:commandLink>
                    </li>
                    <li jsf:rendered="#{loginController.adminGe || loginController.consultaGe}">
                        <h:commandLink action="#{operariosGeController.prepareList}">
                            <i class="fa fa-chevron-right"></i> 
                            <span>Maestro de operarios</span>
                        </h:commandLink>
                    </li>
                    <li class="active" jsf:rendered="#{loginController.adminGe || loginController.consultaGe}">
                        <h:commandLink action="#{turnosGeController.prepareList}">
                            <i class="fa fa-chevron-right"></i> 
                            <span>Maestro de turnos</span>
                        </h:commandLink>
                    </li>
                    <li jsf:rendered="#{loginController.adminGe || loginController.consultaGe}">
                         <h:commandLink action="#{nominalGeController.prepareList}">
                            <i class="fa fa-chevron-right"></i> 
                            <span>Maestro de Maquinas/Nominal</span>
                        </h:commandLink>
                    </li>
                    <li jsf:rendered="#{loginController.adminGe || loginController.consultaGe}">
                        <h:commandLink action="#{paradasGeController.prepareList}">
                            <i class="fa fa-chevron-right"></i> 
                            <span>Maestro de tipos de Paradas</span>
                        </h:commandLink>
                    </li>
                    <li jsf:rendered="#{loginController.adminGe || loginController.consultaGe}">
                        <h:commandLink action="/administrador/modGeTelares/menuMaestros">
                            <i class="fa fa-cog"></i> 
                            <span>Más configuraciones</span>
                        </h:commandLink>
                    </li>
                    <p:separator/>
                    <li>
                        <h:commandLink action="/index">
                            <i class="fa fa-dashboard"></i> 
                            <span>Vista de usuario estándar</span>
                        </h:commandLink>
                    </li>
                    <li>
                        <h:commandLink action="/administrador/modulos">
                            <i class="fa fa-th"></i>
                            <span>Modulos del sistema</span>
                        </h:commandLink>
                    </li>
                </ul>
            </h:form>
        </ui:define>
        <ui:define name="title">Turnos</ui:define>   
        <ui:define name="title2">Turnos</ui:define>   
        <ui:define name="body">
            <p:growl id="growl" showDetail="true" life="2000"/>
            <h:form id="Create">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <h:outputLabel value="Código:"  />
                            <p:inputText id="codigo"
                                        required="true"
                                        maxlength="10"
                                        requiredMessage="Ingresar codigo"
                                        value="#{turnosGeController.turnosGeActual.codigoTurno}">
                            </p:inputText>
                            <p:message id="codigoMessage" for="codigo" styleClass="error"/>
                        </div>
                        <div class="form-group">
                            <h:outputLabel value="Nombre:"  />
                            <p:inputText id="nombre"
                                        required="true"
                                        maxlength="100"
                                        requiredMessage="Ingresar nombre del turno"
                                        value="#{turnosGeController.turnosGeActual.nombre}">
                            </p:inputText>
                            <p:message id="nombreMessage" for="nombre" styleClass="error"/>
                        </div>
                        <div class="form-group">
                            <h:outputLabel value="Hora inicio:"  />
                            <p:calendar id="horaInicio" required="true" autocomplete="off" requiredMessage="Favor ingresar la hora final" value="#{turnosGeController.turnosGeActual.horaInicio}" pattern="HH:mm" timeOnly="true"  />    
                            <p:message id="horaInicioMessage" for="horaInicio" styleClass="error"/>
                        </div>
                        <div class="form-group">
                            <h:outputLabel value="Hora fin:"  />
                            <p:calendar id="horaFin" required="true" autocomplete="off" requiredMessage="Favor ingresar la hora final" value="#{turnosGeController.turnosGeActual.horaFin}" pattern="HH:mm" timeOnly="true"  />    
                            <p:message id="horaFinMessage" for="horaFin" styleClass="error"/>
                        </div>
                        <div class="form-group">
                            <p:selectBooleanCheckbox value="#{turnosGeController.turnosGeActual.estado}" itemLabel="Activado"/>
                        </div>
                        <div class="form-group">
                            <p:commandButton class="btn btn-primary btn-block"
                                             ajax="false"
                                             value="Guardar"
                                             icon="fa fa-cube"
                                             styleClass="boton-prime"
                                             style="width: 100%"
                                             action="#{turnosGeController.update}"
                                             onclick="onSubmitButton();"/>
                            <p:button styleClass="boton-primeRojo" 
                                    value="Cancelar" 
                                    outcome="lista"
                                    icon="fa fa-arrow-left"
                                    style="margin-top: 10px; background: red !important; width: 100%"/>
                        </div> 
                    </div> 
                </div> 
            </h:form>
        </ui:define>
    </ui:composition>
</html>
